name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['k8s/**', '*.md']      # don't re-trigger when the bot updates the manifest

permissions:
  id-token: write      # needed for OIDC -> AWS
  contents: write      # needed to commit the new image tag back

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: dateflyx

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test                      # basic application tests

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$ECR_REPOSITORY:$TAG .
          docker push $REGISTRY/$ECR_REPOSITORY:$TAG
          echo "IMAGE=$REGISTRY/$ECR_REPOSITORY:$TAG" >> $GITHUB_ENV

      - name: Update manifest with new image tag
        run: |
          sed -i "s|image: .*dateflyx:.*|image: ${IMAGE}|" k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "ci: deploy ${GITHUB_SHA::7}"
          git push
